<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toronto Bike Counters</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="panel.js"></script>
</head>
<body>

  <header>
    <div class="header-row">
      <div>
        <h1>Toronto Permanent Bike Counters</h1>
        <p></p>
      </div>
      <button id="header-info-btn" title="About this data">i</button>
    </div>
  </header>

  <div id="main">
    <div id="panel">
      <button id="panel-close">&times;</button>
      <div id="panel-content"></div>
    </div>
    <div id="map"></div>
  </div>

  <div id="data-modal" class="modal-overlay">
    <div class="modal-box">
      <button id="modal-close" class="modal-close">&times;</button>
      <h2 class="modal-title">About this map</h2>
      <div class="modal-body">
        <p>This map uses data from <a href="https://open.toronto.ca/" target="_blank" rel="noopener noreferrer">Toronto Open Data</a>.</p>
        <ul>
          <li><a href="https://open.toronto.ca/dataset/permanent-bicycle-counters/" target="_blank" rel="noopener noreferrer">Permanent Bike Counters dataset</a></li>
          <li><a href="https://open.toronto.ca/dataset/cycling-network/" target="_blank" rel="noopener noreferrer">Cycling Network dataset</a></li>
          <li><a href="https://open.toronto.ca/dataset/city-wards/" target="_blank" rel="noopener noreferrer">City Wards dataset</a></li>
        </ul>
      </div>
    </div>
  </div>

  <script src="map.js"></script>
  <script>
    const modal      = document.getElementById("data-modal");
    const modalClose = document.getElementById("modal-close");
    document.getElementById("header-info-btn").addEventListener("click", () => modal.classList.add("open"));
    modalClose.addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });
  </script>

</body>
</html>
